name: Maintain Benefits

# Falsifiability (per the "running systems" convention — criterion is contract, cycle history is the Actions run log).
#   Working-when: each scheduled run COMPLETES the audit — observable as either a `[Maintenance]` PR opened, OR (when no
#     fixes were needed) an outcome comment closing every open `link-health` issue ("All benefits are healthy." / "{N}
#     require manual review"). NOT a fixed-count: a clean audit (no fixes, no open link-health issues) is healthy, but that
#     case leaves no artifact, so liveness here is verified primarily from the Actions run log showing the scheduled run ran
#     green. A Sunday with NO run in the Actions log = the cron silently isn't firing → broken, not empty.
#   Teardown after N: 8 weekly cycles (~2 months). If no scheduled run appears for 8 consecutive Sundays, the
#     auto-maintenance thesis is wrong → remove this workflow. (N is adjustable.)

on:
  schedule:
    - cron: '0 14 * * 0'  # Sunday 14:00 UTC
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: now
        run: |
          {
            echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "date=$(date -u +%F)"
            echo "year=$(date -u +%Y)"
          } >> "$GITHUB_OUTPUT"

      - name: Check every link; Jev judges the loaded pages
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 scripts/check_links.py > flags.json

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ vars.CLAUDE_MODEL }} --allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebSearch,WebFetch,Bash(git:*),Bash(gh:*),Bash(python3 scripts/validate_data.py)'"
          prompt: |
            You fix the benefits in `data/benefits.json` that this week's audit flagged, validate, and open and merge a single PR.

            ## Input: `flags.json`

            `scripts/check_links.py` already fetched every link and, when `jev` is true, had Jev (a classifier model) judge each loaded page. Entries not listed are healthy — do not open them. Each flag has a `problem`:

            - `broken` (4xx/5xx) or `unreachable` — the link is dead.
            - `redirected` — the final URL's hostname differs; `final_url` holds it.
            - `judged` — Jev scored the entry below 0.5 on the questions in `failed`: `offer_page` (not the program's own student signup/pricing/overview page), `offers_described` (the page no longer offers what the description says), `specific` (description names no concrete plan, amount, or duration), `self_serve` (only claimable through an institution), `offer_type:<x>` (description reads as `<x>`, not the stored `offer_type`). Jev is a fast judge, not ground truth: confirm with WebFetch before changing anything.
            - `unjudged` — the page loaded but was not judged (`reason`). Review it yourself for the five questions above.

            Only act on unambiguous cases; when uncertain, leave the entry unchanged.

            ## Step 1: Fix

            For a dead, redirected, or wrong link: WebSearch `"{name}" student discount signup`, WebFetch the best result, and set `link` to the program's own signup/pricing/overview page (copy the loaded URL verbatim). If the program no longer offers a student benefit, remove the entry. Fix `offer_type` mismatches and vague descriptions in place, keeping the offer specifics and ≤120 chars. Preserve 2-space indent, trailing newline, and id-sort order.

            ## Step 2: Validate

            Run `python3 scripts/validate_data.py` and fix what it flags until it exits 0. It owns every mechanical rule (https-only, forbidden subdomains and paths, schema, ≤120 chars, sort order); do not re-derive them.

            ## Step 3: Open a PR and merge it (only if you changed the file)

            Branch `maintain-benefits-${{ steps.now.outputs.date }}`, title `[Maintenance]: Fix {N} benefit(s)`. Body: a one-sentence Summary, a table of what changed (benefit, problem, fix), and separately anything removed and why. Omit empty sections. Commit with `--author="Claude <noreply@anthropic.com>"`, push, `gh pr create`, then `gh pr merge --squash --delete-branch`.

            ## Step 4: Close `link-health` issues

            Close each open `link-health` issue with its outcome: "Fixed in PR #{n}." if you merged one, "All benefits are healthy." if nothing needed fixing, or "Found {N} issue(s) that require manual review: {names}." for findings you could not safely fix.
