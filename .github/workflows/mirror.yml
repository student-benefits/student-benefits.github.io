# Mirrors each new issue into the private student-benefits/directory repo, where the workflows run.
# Only collaborators' issues keep their labels and so start a workflow; others wait for the maintainer.
name: Mirror issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      TITLE: ${{ github.event.issue.title }}
      TRUSTED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    steps:
      - run: |
          set -euo pipefail
          { jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH"; printf '\n\n<!-- public:%s -->\n' "$(jq -r .issue.number "$GITHUB_EVENT_PATH")"; } > body.md
          labels=$(jq -r '[.issue.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
          [ "$TRUSTED" = true ] || labels=needs-manual-review
          gh issue create --repo student-benefits/directory --title "$TITLE" --body-file body.md ${labels:+--label "$labels"}
