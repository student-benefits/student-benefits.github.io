name: Discover Student Benefits

# Falsifiability (per the "running systems" convention — criterion is contract, cycle history is the Actions run log).
#   Working-when: each scheduled run COMPLETES and leaves a positive trace of having looked — either ≥1 `new-benefit`
#     issue opened, OR `agent/state/last-benefits-discovery.json` rewritten with a fresh `timestamp` (the dated "searched,
#     nothing met the bar" heartbeat). NOT a found-count: silence-by-design (a dry cycle) is healthy iff the heartbeat moves.
#     A run that opens nothing AND doesn't bump the timestamp = the cron silently isn't firing/committing → broken, not empty.
#   Teardown after N: 4 cycles (~2 months). If working-when is unmet for 4 consecutive scheduled cycles, the
#     discovery thesis is wrong → remove this workflow.
#   Cadence: twice a month, on fixed days rather than an even-ISO-week gate so every scheduled
#     run in the Actions log is a real run — a gate-skipped run read as "success" and hid a stale heartbeat.
#   Budget: successful runs take 11–16 min; 3 of 10 were killed at the old 20-min cap (2026-06-29, 08-10, 08-31).

on:
  schedule:
    - cron: '0 14 1,15 * *'  # 1st and 15th, 14:00 UTC
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: now
        run: |
          {
            echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "date=$(date -u +%F)"
            echo "year=$(date -u +%Y)"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ vars.CLAUDE_MODEL }} --allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebSearch,WebFetch,Bash(git:*),Bash(gh:*)'"
          prompt: |
            You proactively discover student benefits not yet in the directory and open GitHub issues for the best finds. The add-benefit workflow will pick them up.

            ## Step 1: Build skip lists

            Read `data/benefits.json`, `data/categories.json`, and `agent/state/rejected.json` (treat missing as empty `[]`).

            Build:
            - **Known names** (lowercase) from existing benefits
            - **Known domains** from existing benefit links (strip `www.`)
            - **Rejected names + domains** from `agent/state/rejected.json` — shape: `[{ "name": "...", "domain": "..." }]`

            Also read open issues labeled `new-benefit` and add their product names (lowercase) to known names — avoids duplicate pipeline submissions.

            ## Step 2: Known sources

            WebFetch each of these (don't skip):

            | Source | URL |
            |---|---|
            | GitHub Student Pack | `https://education.github.com/pack/offers` |
            | JetBrains | `https://www.jetbrains.com/community/education/` |
            | Google for Students | `https://buildyourfuture.withgoogle.com/programs` |
            | Microsoft Education | `https://www.microsoft.com/en-us/education` |
            | AWS Educate | `https://aws.amazon.com/education/awseducate/` |
            | Figma Education | `https://www.figma.com/education/` |
            | Notion for Education | `https://www.notion.so/product/notion-for-education` |
            | Canva for Education | `https://www.canva.com/education/` |
            | Autodesk Education | `https://www.autodesk.com/education/edu-software/overview` |
            | Anthropic (Claude) | `https://www.anthropic.com/education` |
            | OpenAI students | `https://developers.openai.com/community/students` |
            | Google AI for students | `https://gemini.google/students/` |
            | Kiro students | `https://kiro.dev/students/` |
            | Hugging Face education | `https://huggingface.co/education` |

            Extract relevant tools/programs from each. From the GitHub Student Pack, take only offers that would rank 9 or higher on their own (see the quality bar); the directory's GitHub Student Pack entry already covers the rest.

            ## Step 3: Keyword pass (WebSearch)

            Use WebSearch (not WebFetch on a search URL) for each, with `YEAR` = ${{ steps.now.outputs.year }}:

            1. `"student plan" OR "education plan" developer tools software YEAR free`
            2. `"free for students" OR "academic license" AI tools cloud YEAR`
            3. `productivity OR domains student discount OR "free for students" YEAR`
            4. `student grant OR credits developer tools YEAR apply individual`
            5. `site:reddit.com "free for students" software tools list YEAR`
            6. `site:reddit.com "student discount" developer OR design tools YEAR`

            ## Step 4: Verify each candidate

            For each result from Steps 2 and 3: WebFetch the program page. Skip if name or hostname is in the known/rejected sets. Note source (`known-source` or `keyword`).

            Quality bar — reject on any failure:
            1. **Build & grow** (the curation thesis): the benefit must help a student *create, learn, ship, or research* — dev tools, infrastructure, cloud/AI credits, design and learning platforms, the hardware students build on. Reject consumption perks regardless of how good the deal is: entertainment (music, video streaming), shopping, consumer subscriptions (e.g. a consumer VPN), and broad discount aggregators (Student Beans / UNiDAYS-style). If it doesn't advance building or learning, skip it.
            2. **Value**: rank it with the `popularity` rubric in `AGENTS.md`, from the terms on the program page. Reject anything that ranks 1–4: a discount under 50%, an offer little beyond the public free tier, or a tool peripheral to building or learning.
            3. **GitHub Student Pack**: an offer reached through the Pack must rank 9 or higher on its own.
            4. **Fills a gap**: in a category that already holds 10 or more entries in `data/benefits.json`, the candidate must rank 8 or higher.
            5. Recognizable product with real student community
            6. Self-serve student program page (not "contact us" / institutional purchase)
            7. Active signup page

            Fewer issues is the expected outcome: open none rather than one that misses the bar.

            Shortlist up to **5 new benefits** across both passes.

            The `**Signup**` URL you record in Step 5 MUST be a URL you actually loaded with WebFetch in this run (the program page from this step, or a real signup link found on it). Never construct or guess a path from the product name — an invented `/github-students`-style URL that 404s poisons the downstream add-benefit PR, which trusts the link you provide. Copy the working URL verbatim; if a redirect occurred, record the final URL.

            ## Step 5: Open issues

            For each, create one GitHub issue:
            - **Title**: product name only (e.g. `Figma`)
            - **Body**:
              ```
              **What students get**: <one specific sentence — plan, amount, or duration>
              **Rank**: <6–10 from the rubric, with one clause on why>
              **Signup**: <direct URL — must be one you loaded successfully in Step 4, copied verbatim>
              **Discovered via**: <known-source | keyword>
              **Pack**: GitHub Student Pack
              ```
              Omit `**Pack**` line unless discovered from the GitHub Student Pack source.

            ## Step 6: Update log

            Replace `agent/state/last-benefits-discovery.json` entirely:
            ```json
            {
              "timestamp": "${{ steps.now.outputs.iso }}",
              "model": "${{ vars.CLAUDE_MODEL }}",
              "known_sources_checked": ["<url>", "..."],
              "keyword_queries": ["<q1>", "..."],
              "discovered": [{ "name": "...", "link": "...", "source": "known-source | keyword" }],
              "issues_created": <number>
            }
            ```

            This is the heartbeat this workflow's working-when criterion depends on — commit and push it directly to `main`, no PR needed (it's internal state, not public data): `git add agent/state/last-benefits-discovery.json && git commit --author="Claude <noreply@anthropic.com>" -m "Update benefits discovery log" && git push origin HEAD:main`. Do this every run, whether or not you opened any issues — a run that finds nothing is still a healthy heartbeat as long as this file moves.
