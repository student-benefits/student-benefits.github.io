name: Submit New Event
description: Suggest a student event, hackathon, fellowship, or program to add
title: "[Event]: "
labels: ["new-event"]
body:
  - type: markdown
    attributes:
      value: |
        A name is enough; the page, dates and details are looked up for you.

  - type: textarea
    id: description
    attributes:
      label: What's the event?
      placeholder: |
        "MLH Global Hack Week"
        "HackMIT 2026 applications are open, with free travel grants for students outside Boston"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link (optional)
      placeholder: https://example.com/apply
