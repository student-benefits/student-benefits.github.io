  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Student Benefits Hub",
  "url": "https://student-benefits.github.io/benefits/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "https://student-benefits.github.io/benefits/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
  </script>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Student Benefits Hub",
  "description": "Free and discounted dev tools, cloud credits, AI/ML platforms, and design resources for students. Curated for programs that help students build, learn, ship, or research; consumption perks are excluded.",

    "student discounts",
    "free developer tools",
    "cloud credits",
    "student software",
    "AI tools for students"
  ],
  "distribution": [
    {
      "@type": "DataDownload",
      "encodingFormat": "application/json",
      "contentUrl": "https://student-benefits.github.io/data/benefits.json"
    }
  ]
}
  </script>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="page">

            <div class="site-id">

              <span class="site-sep" aria-hidden="true">|</span>

          </div>
          <div class="header-actions">

              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>

          <div id="filter-bar" role="group" aria-label="Filter by category" class="filter-bar"></div>
        </div>

        <div id="results-bar" class="results-bar" aria-live="polite" aria-atomic="true"></div>
